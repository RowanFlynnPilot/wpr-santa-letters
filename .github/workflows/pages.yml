name: Pages

on:
  # Every PR, whatever it touches: main requires this job (CLAUDE.md, Commands).
  pull_request:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_MAILBAG_PAGE_URL: ${{ vars.VITE_MAILBAG_PAGE_URL }}
          VITE_WRITE_PAGE_URL: ${{ vars.VITE_WRITE_PAGE_URL }}
          VITE_RULES_URL: ${{ vars.VITE_RULES_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  # The reader's pages in a real browser against a made-up mailbag (web/tests): what's on them, no sideways
  # scroll, the stamp, an accessibility scan, and each page's screenshot against the approved one. Runs in
  # Playwright's own image so a pixel means the same thing as where the screenshots were approved
  # (scripts/browser-tests.sh); keep the tag in step with @playwright/test in web/package.json.
  browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001 --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-tests
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  deploy:
    # A page that fails its browser tests isn't published.
    needs: [web, browser]
    # Main only, even when run by hand: a feature branch must never deploy to production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
